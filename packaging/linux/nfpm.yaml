# .deb and .rpm from the staged app folder (packaging/stage.sh linux-x64 ...
# dist/orchard-download-manager), built in CI from the repository root:
#   VERSION=1.0.0 nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
name: orchard-download-manager
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Stephan Lengl <lengl.stephan@gmail.com>
description: |
  Keyboard-friendly download manager: segmented, resumable HTTP(S)
  downloads with a queue, speed limits, a scheduler, clipboard watching
  and checksums.
vendor: Stephan Lengl
homepage: https://github.com/sandboxly/orchard-download-manager
license: MIT
contents:
  # The executable and licenses/.
  - src: dist/orchard-download-manager
    dst: /opt/orchard-download-manager
    type: tree
  - src: /opt/orchard-download-manager/orchard-download-manager
    dst: /usr/bin/orchard-download-manager
    type: symlink
  - src: packaging/linux/orchard-download-manager.desktop
    dst: /usr/share/applications/orchard-download-manager.desktop
  - src: packaging/linux/orchard-download-manager.png
    dst: /usr/share/icons/hicolor/256x256/apps/orchard-download-manager.png
  - src: dist/orchard-download-manager/licenses
    dst: /usr/share/doc/orchard-download-manager
    type: tree
overrides:
  deb:
    depends:
      # nfpm doesn't compute shared-library dependencies: the binary is built
      # on Ubuntu 22.04 (glibc 2.35).
      - libc6 (>= 2.35)
      - libgcc-s1
      # HTTPS: the system's certificate authorities.
      - ca-certificates
      # Loaded at run time: keyboard handling, windows (X11; Wayland is
      # recommended), fonts.
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - fontconfig
      # GPU: the Vulkan or EGL loader plus a driver (Mesa's run on any hardware,
      # in software if needed); the loader alone can't draw anything.
      - libvulkan1 | libegl1
      - mesa-vulkan-drivers | vulkan-icd | libegl-mesa0
    recommends:
      - mesa-vulkan-drivers
      - libwayland-client0
      - fonts-dejavu-core
  rpm:
    depends:
      - glibc >= 2.35
      - ca-certificates
      - libxkbcommon
      - libxkbcommon-x11
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - fontconfig
      - (vulkan-loader or mesa-libEGL)
      - (mesa-vulkan-drivers or mesa-libEGL)
    recommends:
      - mesa-vulkan-drivers
      - libwayland-client
      - dejavu-sans-mono-fonts
rpm:
  group: Applications/Internet
