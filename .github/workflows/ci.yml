name: CI

# Every push and pull request: tests on Linux, Windows and macOS, and the
# Windows/Linux packages and the macOS dmg as workflow artifacts. A pushed tag vX.Y.Z also
# uploads those packages to a draft GitHub release (never published here;
# see docs/RELEASING.md).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04: the oldest glibc we ship for (same as the packages).
        os: [ubuntu-22.04, windows-latest, macos-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build
        with:
          components: clippy
          cache-key: test

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --no-fail-fast

      - name: Release build
        run: cargo build --locked --release

      - name: Self-test of the release build
        run: |
          exe=target/release/orchard-download-manager
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --self-test

      # The real app: window, GPU surface, local socket; quits after the first
      # frame. The self-test alone can't catch a crash at startup.
      - name: Start the app (window, first frame, quit)
        timeout-minutes: 3
        env:
          ORCHARD_DOWNLOAD_MANAGER_EXIT_AFTER_START: "1"
        run: |
          export ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR="$RUNNER_TEMP/odm-config"
          exe=target/release/orchard-download-manager
          case "$RUNNER_OS" in
            Windows) "$exe.exe" ;;
            Linux) xvfb-run -a "$exe" ;;
            *) "$exe" ;;
          esac
          if [ -f "$ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR/crash.log" ]; then cat "$ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR/crash.log"; exit 1; fi

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]  # 22.04: an older glibc runs on more distributions
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build
        with:
          cache-key: package

      - name: Release build
        run: cargo build --locked --release

      - name: Version
        run: |
          id="$(cargo pkgid)"
          echo "VERSION=${id##*[#@]}" >> "$GITHUB_ENV"
          echo "version ${id##*[#@]}"

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2

      - name: Rust crate licenses (licenses/THIRD-PARTY-RUST.txt)
        run: |
          if ! scripts/third-party-licenses.sh --check; then
            echo "::warning file=licenses/THIRD-PARTY-RUST.txt::out of date (packages get a regenerated copy); rerun the script and commit"
            scripts/third-party-licenses.sh
          fi

      - name: Stage the app folder
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            packaging/stage.sh win-x64 target/release/orchard-download-manager.exe dist/orchard-download-manager
          else
            packaging/stage.sh linux-x64 target/release/orchard-download-manager dist/orchard-download-manager
          fi

      - name: Self-test of the staged app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dist/orchard-download-manager/orchard-download-manager.exe --self-test
          else
            echo "linked libraries:"
            ldd dist/orchard-download-manager/orchard-download-manager
            if ldd dist/orchard-download-manager/orchard-download-manager | grep -q "not found"; then exit 1; fi
            objdump -T dist/orchard-download-manager/orchard-download-manager | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
            dist/orchard-download-manager/orchard-download-manager --self-test
          fi

      - name: Windows installer and zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\orchard-download-manager.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item dist\Orchard-Download-Manager-Setup.exe release\
          Compress-Archive -Path dist\orchard-download-manager -DestinationPath release\Orchard-Download-Manager-Windows.zip

      - name: Test the installer (silent install, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process release\Orchard-Download-Manager-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Orchard Download Manager"
          $exe = "$app\orchard-download-manager.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          foreach ($f in 'licenses\LICENSE.txt', 'licenses\THIRD-PARTY-RUST.txt', 'orchard-download-manager.ico', 'unins000.exe') {
            if (-not (Test-Path "$app\$f")) { throw "missing $app\$f" }
          }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Orchard Download Manager.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu entry: $lnk" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7C8BB7BB-8001-44C5-91BF-AB4A0D533DA9}_is1'
          if (-not (Test-Path $key)) { throw "no uninstall entry: $key" }
          $run = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($run.ExitCode) { throw "self-test of the installed app failed ($($run.ExitCode))" }
          # Start the installed app for real (window, first frame, quit), as a user would.
          $env:ORCHARD_DOWNLOAD_MANAGER_EXIT_AFTER_START = '1'
          $env:ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR = "$env:RUNNER_TEMP\odm-installed"
          $run = Start-Process $exe -Wait -PassThru
          $env:ORCHARD_DOWNLOAD_MANAGER_EXIT_AFTER_START = $null
          if (Test-Path "$env:RUNNER_TEMP\odm-installed\crash.log") { Get-Content "$env:RUNNER_TEMP\odm-installed\crash.log"; throw "the installed app crashed at start" }
          if ($run.ExitCode) { throw "the installed app exited with $($run.ExitCode) at start" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The uninstaller continues from a copy of itself in TEMP: wait for it to finish.
          foreach ($i in 1..30) { if (-not (Test-Path $app)) { break }; Start-Sleep 1 }
          if (Test-Path $app) {
            Get-ChildItem -Recurse $app | ForEach-Object { Write-Host "  left $($_.FullName)" }
            throw "uninstall left $app behind"
          }
          if (Test-Path $lnk) { throw "uninstall left the Start menu entry behind" }

      - name: Linux packages (tar.gz, deb, rpm, AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release tools
          tar czf release/Orchard-Download-Manager-Linux.tar.gz -C dist orchard-download-manager
          curl -fsSL -o tools/nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  tools/nfpm.tar.gz" | sha256sum -c
          tar xzf tools/nfpm.tar.gz -C tools nfpm
          tools/nfpm package -f packaging/linux/nfpm.yaml -p deb -t release/Orchard-Download-Manager-Linux-x86_64.deb
          tools/nfpm package -f packaging/linux/nfpm.yaml -p rpm -t release/Orchard-Download-Manager-Linux-x86_64.rpm
          # AppImage: the app folder plus a launcher, desktop entry and icon.
          mkdir -p AppDir/usr/lib
          cp -a dist/orchard-download-manager AppDir/usr/lib/orchard-download-manager
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/linux/orchard-download-manager.desktop packaging/linux/orchard-download-manager.png AppDir/
          curl -fsSL -o tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  tools/appimagetool" | sha256sum -c
          chmod +x tools/appimagetool
          ARCH=x86_64 tools/appimagetool --appimage-extract-and-run AppDir release/Orchard-Download-Manager-Linux-x86_64.AppImage
          ls -l release

      - name: Test the Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info release/Orchard-Download-Manager-Linux-x86_64.deb
          sudo apt-get install -y ./release/Orchard-Download-Manager-Linux-x86_64.deb
          test -L /usr/bin/orchard-download-manager
          test -f /usr/share/applications/orchard-download-manager.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/orchard-download-manager.png
          test -f /opt/orchard-download-manager/licenses/THIRD-PARTY-RUST.txt
          desktop-file-validate /usr/share/applications/orchard-download-manager.desktop || true
          orchard-download-manager --version
          orchard-download-manager --self-test
          sudo apt-get remove -y orchard-download-manager
          if [ -e /opt/orchard-download-manager ] || [ -e /usr/bin/orchard-download-manager ]; then
            echo "removing the package left files behind"; find /opt/orchard-download-manager; exit 1
          fi
          chmod +x release/Orchard-Download-Manager-Linux-x86_64.AppImage
          release/Orchard-Download-Manager-Linux-x86_64.AppImage --appimage-extract-and-run --self-test
          # The tarball runs from wherever it is unpacked.
          mkdir -p "$RUNNER_TEMP/tgz"
          tar xzf release/Orchard-Download-Manager-Linux.tar.gz -C "$RUNNER_TEMP/tgz"
          "$RUNNER_TEMP/tgz/orchard-download-manager/orchard-download-manager" --self-test

      # The runner already has every library: only a clean system shows
      # whether the packages' declared dependencies are enough.
      - name: Test the deb (clean Ubuntu and Debian containers)
        if: runner.os == 'Linux'
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12 debian:13; do
            echo "::group::$image"
            docker run --rm -v "$PWD/release:/release:ro" -e ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR=/tmp/odm-config \
              -e DEBIAN_FRONTEND=noninteractive "$image" \
              bash -euxc 'apt-get update -qq
                          apt-get install -y -qq /release/Orchard-Download-Manager-Linux-x86_64.deb
                          orchard-download-manager --self-test
                          apt-get remove -y -qq orchard-download-manager
                          test ! -e /opt/orchard-download-manager'
            echo "::endgroup::"
          done

      - name: Test the rpm (Fedora container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/release:/release:ro" -e ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR=/tmp/odm-config fedora:42 \
            bash -euxc 'dnf install -y /release/Orchard-Download-Manager-Linux-x86_64.rpm
                        rpm -ql orchard-download-manager
                        orchard-download-manager --self-test
                        dnf remove -y orchard-download-manager
                        test ! -e /opt/orchard-download-manager'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  # The dmg (packaging/macos/package.sh), signed with the Developer ID and
  # notarized. Without the signing secrets (pull requests from forks) it is
  # signed ad-hoc and not notarized; a tag always needs them.
  package-macos:
    name: Package (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build
        with:
          cache-key: package

      # A keychain of its own, made the default, so package.sh finds the
      # Developer ID identity and the "orchard-commander" notary profile just
      # as on a Mac. The secrets are listed in docs/RELEASING.md.
      - name: Signing keychain
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::a release needs the signing secrets"; exit 1; fi
            echo "::warning::no signing secrets: the dmg is signed ad-hoc and not notarized"
            echo "args=--adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -hex 24)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$kc" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"
          security find-identity -v -p codesigning "$kc"
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials orchard-commander \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "args=--notarize" >> "$GITHUB_OUTPUT"

      - name: App bundle and dmg
        run: packaging/macos/package.sh ${{ steps.signing.outputs.args }}

      # The app as a user gets it: copied out of the dmg, started for real
      # (window, first frame, quit).
      - name: Start the app from the dmg
        timeout-minutes: 3
        env:
          ORCHARD_DOWNLOAD_MANAGER_EXIT_AFTER_START: "1"
        run: |
          export ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR="$RUNNER_TEMP/odm-dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/Orchard-Download-Manager-macOS.dmg
          ditto "$mnt/Orchard Download Manager.app" "$RUNNER_TEMP/Orchard Download Manager.app"
          hdiutil detach "$mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/Orchard Download Manager.app"
          "$RUNNER_TEMP/Orchard Download Manager.app/Contents/MacOS/orchard-download-manager"
          if [ -f "$ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR/crash.log" ]; then cat "$ORCHARD_DOWNLOAD_MANAGER_CONFIG_DIR/crash.log"; exit 1; fi

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macOS
          path: dist/*.dmg
          if-no-files-found: error

  # Tag vX.Y.Z: put the packages (Windows, Linux, macOS) on a draft release
  # for the tag (created if missing). The maintainer publishes.
  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml's version $version"; exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release

      - name: Upload to the draft release
        run: |
          ls -l release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Orchard Download Manager ${TAG#v}" --notes ""
          fi
          gh release upload "$TAG" release/* --clobber
