[package]
name = "orchard-download-manager"
version = "1.0.1"
edition = "2024"
license = "MIT"
authors = ["Stephan Lengl <lengl.stephan@gmail.com>"]
rust-version = "1.90"
description = "A themeable, keyboard-friendly download manager with segmented, resumable downloads"

[[bin]]
name = "orchard-download-manager"
path = "src/main.rs"

[dependencies]
# The Orchard apps' shared crates (Orchard Commons), pinned to a release tag
# (for a local change to them, override with a [patch] section pointing at a
# checkout): the character-grid renderer (wgpu + winit), color schemes, frame
# styles and the color-schemes folder shared with Orchard Commander, the UI
# kit (background tasks, input events, widgets, dialog forms, the clipboard's
# text) and the shell (window, event loop, command line, settings files).
orchard-grid = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
orchard-theme = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
orchard-kit = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
orchard-shell = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
# HTTP(S) on plain threads. No gzip: downloads need the bytes as served, so
# ranges line up. The system's certificate store, HTTP and SOCKS proxies.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
url = "2.5"
percent-encoding = "2.3"
# Watching the clipboard for copied links (src/clipboard.rs).
arboard = { version = "3.6", default-features = false }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# Keep the system awake; register the browser extension's helper.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_Security", "Win32_System_Registry"] }

[build-dependencies]
# The Windows icon and version resource (build.rs).
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
